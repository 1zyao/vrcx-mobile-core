[package]
name = "vrcx-0-mobile-host"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Command set for the in-process phone core"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
vrcx-0-application = { path = "../application" }
vrcx-0-application-core = { path = "../application-core" }
vrcx-0-application-realtime = { path = "../application-realtime" }
vrcx-0-command-server = { path = "../command-server" }
vrcx-0-composition = { path = "../composition" }
vrcx-0-contracts = { path = "../contracts" }
vrcx-0-application-game = { path = "../application-game" }
vrcx-0-core = { path = "../core" }
vrcx-0-outbound-adapters = { path = "../outbound-adapters" }
vrcx-0-persistence = { path = "../persistence" }
vrcx-0-vrchat-protocol = { path = "../vrchat-protocol" }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros", "sync"] }






