[package]
name = "vrcx-0-platform"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Host-neutral platform primitives"

[dependencies]
chrono = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2.workspace = true
specta.workspace = true
thiserror = { workspace = true }
tracing = { workspace = true }
vrcx-0-core = { path = "../core" }

# machine-uid only implements desktop OSes; Android/iOS generate a random
# secrets key into the app data dir instead (see machine_key.rs).
[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
machine-uid = { workspace = true }

[target.'cfg(not(any(windows, target_os = "linux", target_os = "macos")))'.dependencies]
getrandom = "0.2"
