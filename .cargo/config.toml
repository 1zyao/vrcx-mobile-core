[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.'cfg(all(windows, target_env = "msvc"))']
linker = "lld-link.exe"

# Dependencies are resolved from the shared cargo registry again.
#
# A `vendor/` directory used to be configured here to work around the workspace
# carrying a Low integrity label: build scripts could not write into the
# registry, so tauri plugins failed to provision their Android modules. After
# `icacls /setintegritylevel (OI)(CI)M` on D:\vrcx0 that limitation is gone and
# vendoring is unnecessary.
